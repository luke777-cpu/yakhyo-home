<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" font-family="Arial, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="title">도파민 효율성 — 같은 총량, 다른 곡선</title>
<desc id="desc">하루 총 레보도파량이 같을 때, 큰 용량을 네 번 넣어 높은 최고점과 깊은 골이 반복되는 곡선과, 서방형으로 바닥을 받치고 즉방형으로 조금씩 보완해 생활 가능한 구간에 오래 머무는 곡선을 비교한 개념도</desc>
<rect width="960" height="560" rx="28" fill="#f8fafc"/>
<text x="480" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">도파민 효율성 — 같은 총량, 다른 곡선</text>
<text x="480" y="68" text-anchor="middle" font-size="13" fill="#475569">투입한 레보도파의 양에 비해 얼마나 긴 시간 안정적인 기능을 얻는가</text>
