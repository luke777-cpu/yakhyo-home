<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 780" role="img" aria-labelledby="title desc" font-family="Arial, 'Segoe UI', 'Helvetica Neue', sans-serif">
  <title id="title">Levodopa-Induced Dyskinesia — Dopamine Fluctuation and the Medication-Effect Curve</title>
  <desc id="desc">Two line charts. Left: dopamine level over 12 hours, comparing a smooth steady curve in normal physiology to a sharply pulsatile curve in Parkinson's disease, with a shaded functional range bounded by a dyskinesia threshold above and an OFF threshold below. Right: a single levodopa medication-effect curve over 8 hours showing a steep rise, an ON plateau within the functional range, a steep fall through diphasic transition zones, and a prolonged OFF period, illustrating where dyskinesia arises relative to the peak-dose and OFF thresholds.</desc>
