<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc" font-family="Arial, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <title id="title">Parkinson's Disease vs. Multiple System Atrophy — Shared Protein, Different Cells and Sites</title>
  <desc id="desc">Educational diagram comparing Parkinson's disease and Multiple System Atrophy (MSA). Left panel: both diseases involve accumulation of the same alpha-synuclein protein, but in Parkinson's disease it forms Lewy bodies inside neurons, while in MSA it forms glial cytoplasmic inclusions (GCI) inside oligodendrocytes. Right panel: MSA affects three main sites — the striatum and substantia nigra (striatonigral, causing MSA-P parkinsonian features), the autonomic nervous system in the brainstem and spinal cord (causing autonomic failure in both subtypes), and the cerebellum, pons and olive (olivopontocerebellar, causing MSA-C cerebellar ataxia) — with limited response to levodopa because the circuit that receives dopamine is itself damaged.</desc>
  <rect width="1600" height="800" rx="28" fill="#f8fafc"/>

  <defs>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f1d1d"/>
    </marker>
  </defs>

  <!-- ============ LEFT PANEL ============ -->
  <text x="405" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Parkinson's Disease vs. MSA — Same Protein, Different Cells</text>

  <!-- Parkinson's Disease box -->
  <rect x="30" y="75" width="350" height="365" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="205" y="112" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">Parkinson's Disease</text>
  <text x="205" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Neuron</text>

  <!-- Neuron outer circle -->
  <circle cx="205" cy="290" r="105" fill="#93c5fd" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Lewy body inner circle -->
  <circle cx="205" cy="310" r="34" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
  <!-- arrow pointing up into Lewy body -->
  <path d="M205,420 L205,348" fill="none" stroke="#7f1d1d" stroke-width="2.5" marker-end="url(#arrowDark)"/>
  <text x="205" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Lewy body</text>

  <!-- MSA box -->
  <rect x="410" y="75" width="350" height="365" rx="16" fill="#ffe8d9" stroke="#c2410c" stroke-width="3"/>
  <text x="585" y="112" text-anchor="middle" font-size="19" font-weight="700" fill="#7c2d12">MSA</text>
  <text x="585" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Oligodendrocyte</text>

  <!-- star-burst shape -->
  <polygon points="585,175 604.1,233.8 659.3,205.8 631.2,260.9 690,280 631.2,299.1 659.3,354.3 604.1,326.2 585,385 565.9,326.2 510.8,354.3 538.8,299.1 480,280 538.8,260.9 510.8,205.8 565.9,233.8" fill="#fdba8c" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- GCI rectangle inside/below the star -->
  <rect x="495" y="310" width="180" height="60" rx="4" fill="#7f1d1d" stroke="#450a0a" stroke-width="1.5"/>
  <text x="585" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">GCI</text>
  <text x="585" y="352" text-anchor="middle" font-size="10.5" fill="#fecaca">(glial cytoplasmic inclusion)</text>

  <!-- caption pill -->
  <rect x="60" y="452" width="670" height="42" rx="21" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="395" y="478" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Same &#945;-synuclein protein — accumulates in different cells</text>

  <!-- ============ RIGHT PANEL ============ -->
  <text x="1215" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">MSA — Sites Affected and Clinical Subtypes</text>

  <!-- Box 1: Striatonigral -->
  <rect x="850" y="90" width="520" height="110" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="1110" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">Striatum · substantia nigra</text>
  <text x="1110" y="160" text-anchor="middle" font-size="13" fill="#7f1d1d">(striatonigral)</text>

  <rect x="1390" y="115" width="190" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1485" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">MSA-P</text>
  <text x="1485" y="155" text-anchor="middle" font-size="10.5" fill="#7f1d1d">→ parkinsonian features</text>

  <!-- Box 2: Autonomic -->
  <rect x="850" y="250" width="520" height="110" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
  <text x="1110" y="297" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Autonomic nervous system</text>
  <text x="1110" y="320" text-anchor="middle" font-size="13" fill="#7c2d12">(brainstem · spinal cord)</text>

  <rect x="1390" y="275" width="190" height="60" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1485" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Both subtypes</text>
  <text x="1485" y="315" text-anchor="middle" font-size="10.5" fill="#7c2d12">→ autonomic failure</text>

  <!-- Box 3: Olivopontocerebellar -->
  <rect x="850" y="410" width="520" height="110" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
  <text x="1110" y="457" text-anchor="middle" font-size="16" font-weight="700" fill="#134e4a">Cerebellum · pons · olive</text>
  <text x="1110" y="480" text-anchor="middle" font-size="13" fill="#134e4a">(olivopontocerebellar)</text>

  <rect x="1390" y="435" width="190" height="60" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="1485" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">MSA-C</text>
  <text x="1485" y="475" text-anchor="middle" font-size="10.5" fill="#134e4a">→ cerebellar ataxia</text>

  <!-- Levodopa callout -->
  <rect x="905" y="545" width="620" height="64" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1215" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Levodopa response is limited</text>
  <text x="1215" y="588" text-anchor="middle" font-size="11" fill="#475569">(the circuit that receives dopamine is itself damaged)</text>
</svg>
