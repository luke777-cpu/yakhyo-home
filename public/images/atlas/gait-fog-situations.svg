<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc" font-family="Arial, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="title">Atlas 4-2. 멈춤이 잘 생기는 상황</title>
<desc id="desc">문턱 통과, 방향 전환, 이중과제 상황에서 발이 바닥에 붙는 장면을 단순화한 그림</desc>
<rect width="960" height="430" rx="28" fill="#f8fafc"/>
<text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Atlas 4-2. 멈춤이 잘 생기는 상황</text>
<text x="480" y="66" text-anchor="middle" font-size="13" fill="#475569">공통점: 자동으로 돌아가던 보행에 갑자기 시공간 재계산이나 주의 전환이 끼어든다</text>
<rect x="40" y="90" width="280" height="300" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40" y="90" width="280" height="34" rx="16" fill="#fee2e2"/><rect x="40" y="108" width="280" height="16" fill="#fee2e2"/><text x="180.0" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">문턱 (Doorway effect)</text><rect x="205" y="150" width="70" height="150" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><rect x="215" y="160" width="50" height="140" fill="#e2e8f0" stroke="#94a3b8"/><rect x="60" y="298" width="240" height="6" fill="#94a3b8"/><rect x="200" y="290" width="80" height="10" rx="2" fill="#dc2626"/><g transform="translate(130,180) rotate(0 0 90)" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="0" cy="12" r="11" fill="#e2e8f0"/><path d="M0 23 L0 68"/><path d="M0 34 L-16 56 M0 34 L16 54"/><path d="M0 68 L-8 105 M0 68 L8 105"/><path d="M-14 106 L26 106" stroke="#dc2626" stroke-width="5"/></g><ellipse cx="178" cy="150" rx="34" ry="18" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><circle cx="154" cy="174" r="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="178" y="155" text-anchor="middle" font-size="13" fill="#475569">…</text><text x="180" y="340" text-anchor="middle" font-size="12" fill="#475569">출입문·엘리베이터 앞에서</text><text x="180" y="357" text-anchor="middle" font-size="12" fill="#475569">발이 떨어지지 않음</text><rect x="340" y="90" width="280" height="300" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="340" y="90" width="280" height="34" rx="16" fill="#fef3c7"/><rect x="340" y="108" width="280" height="16" fill="#fef3c7"/><text x="480.0" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">회전 (Turning)</text><path d="M400 300 A70 30 0 1 1 540 300" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 6"/><path d="M540 300 L528 288 M540 300 L526 306" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round"/><g transform="translate(470,180) rotate(8 0 90)" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="0" cy="12" r="11" fill="#e2e8f0"/><path d="M0 23 L0 68"/><path d="M0 34 L-16 56 M0 34 L16 54"/><path d="M0 68 L-8 105 M0 68 L8 105"/><path d="M-14 106 L26 106" stroke="#dc2626" stroke-width="5"/></g><ellipse cx="520" cy="150" rx="34" ry="18" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><circle cx="496" cy="174" r="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="520" y="155" text-anchor="middle" font-size="13" fill="#475569">…</text><text x="480" y="340" text-anchor="middle" font-size="12" fill="#475569">방향 전환 시 발이</text><text x="480" y="357" text-anchor="middle" font-size="12" fill="#475569">바닥에 붙어 머뭇거림</text><rect x="640" y="90" width="280" height="300" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="640" y="90" width="280" height="34" rx="16" fill="#ede9fe"/><rect x="640" y="108" width="280" height="16" fill="#ede9fe"/><text x="780.0" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">이중과제 / 주의부하 (Dual task)</text><g transform="translate(760,180) rotate(0 0 90)" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="0" cy="12" r="11" fill="#e2e8f0"/><path d="M0 23 L0 68"/><path d="M0 34 L-16 56 M0 34 L16 54"/><path d="M0 68 L-8 105 M0 68 L8 105"/><path d="M-14 106 L26 106" stroke="#dc2626" stroke-width="5"/></g><ellipse cx="815" cy="150" rx="34" ry="18" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><circle cx="791" cy="174" r="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="815" y="155" text-anchor="middle" font-size="13" fill="#475569">2+7=?</text><rect x="812" y="215" width="14" height="22" rx="3" fill="#334155"/><text x="780" y="340" text-anchor="middle" font-size="12" fill="#475569">대화·계산 등 주의분산 시</text><text x="780" y="357" text-anchor="middle" font-size="12" fill="#475569">보행 시작·유지 어려움</text><text x="480" y="414" text-anchor="middle" font-size="11" fill="#888">교육용 도식. 붉은 선은 발이 바닥에 붙은 상태를 뜻한다.</text></svg>