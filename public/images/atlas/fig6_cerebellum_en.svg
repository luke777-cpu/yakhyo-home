<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc" font-family="Arial, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <title id="title">Basal ganglia vs. cerebellum, and the bypass strategy in Parkinson's disease</title>
  <desc id="desc">Left panel compares how the basal ganglia select and initiate movement while the cerebellum corrects it using error and sensory feedback; right panel shows how visual cues, auditory cues, cerebellum-cortex pathways, and conscious planning can bypass a blocked basal ganglia circuit to reach the goal of movement.</desc>
  <rect width="1600" height="820" rx="28" fill="#f8fafc"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="tealArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker>
  </defs>

  <!-- panel divider -->
  <line x1="800" y1="60" x2="800" y2="780" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ============ LEFT PANEL ============ -->
  <text x="400" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Basal Ganglia vs. Cerebellum: Comparing Their Roles</text>

  <!-- Cortex box -->
  <rect x="260" y="70" width="280" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="400" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Cerebral Cortex</text>
  <text x="400" y="132" text-anchor="middle" font-size="14" fill="#1e3a8a">— Motor Plan</text>

  <!-- Basal Ganglia box -->
  <rect x="40" y="270" width="300" height="100" rx="14" fill="#fde3db" stroke="#c2410c" stroke-width="2.5"/>
  <text x="190" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Basal Ganglia</text>
  <text x="190" y="334" text-anchor="middle" font-size="13" fill="#7c2d12">(Circuit That Opens the Gate)</text>

  <!-- Cerebellum box -->
  <rect x="460" y="270" width="300" height="100" rx="14" fill="#d4f3ec" stroke="#0f766e" stroke-width="2.5"/>
  <text x="610" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#0f4c46">Cerebellum</text>
  <text x="610" y="334" text-anchor="middle" font-size="13" fill="#0f4c46">(Corrector of Movement)</text>

  <!-- Muscles box -->
  <rect x="180" y="550" width="440" height="90" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
  <text x="400" y="602" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Muscles · Actual Movement</text>

  <!-- Cortex -> Basal Ganglia -->
  <path d="M 300 160 L 250 270" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="150" y="210" text-anchor="start" font-size="13" fill="#334155">Copy of command</text>

  <!-- Cortex -> Cerebellum -->
  <path d="M 500 160 L 610 270" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="630" y="210" text-anchor="start" font-size="13" fill="#334155">Copy of plan</text>

  <!-- Basal Ganglia -> Muscles -->
  <path d="M 150 370 L 230 550" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="130" y="440" text-anchor="end" font-size="13" fill="#334155">Selects &amp; initiates movement</text>

  <!-- Cerebellum -> Muscles (two separate, cleanly spaced labels) -->
  <path d="M 560 370 L 470 550" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="590" y="440" text-anchor="start" font-size="13" fill="#334155">Error-correction signal</text>

  <path d="M 680 370 L 580 550" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="590" y="480" text-anchor="start" font-size="13" fill="#334155">Sensory feedback</text>

  <!-- ============ RIGHT PANEL ============ -->
  <text x="1200" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Parkinson's Disease: A Bypass Strategy</text>

  <!-- Green cue/strategy boxes -->
  <rect x="860" y="90" width="300" height="70" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1010" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Visual cues (lines, stairs)</text>

  <rect x="860" y="200" width="300" height="70" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1010" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Cerebellum-cortex bypass</text>

  <rect x="860" y="310" width="300" height="70" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1010" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Auditory cues (rhythm)</text>

  <rect x="860" y="420" width="300" height="70" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1010" y="461" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Conscious motor planning</text>

  <!-- connectors from each green box to the main bypass curve -->
  <path d="M 1160 125 L 1195 125" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <path d="M 1160 235 L 1258 235" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <path d="M 1160 345 L 1322 345" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <path d="M 1160 455 L 1387 455" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#greenArrow)"/>

  <!-- blocked basal-ganglia circuit (vertical line + red X) -->
  <line x1="1300" y1="70" x2="1300" y2="560" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <line x1="1275" y1="275" x2="1325" y2="325" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <line x1="1325" y1="275" x2="1275" y2="325" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <text x="1315" y="250" text-anchor="start" font-size="13" fill="#64748b">Basal ganglia circuit</text>
  <text x="1315" y="268" text-anchor="start" font-size="13" fill="#64748b">(blocked)</text>

  <!-- main bypass curve crossing the blocked line and ending at the goal -->
  <path d="M 1180 90 C 1250 160, 1230 240, 1300 300 C 1360 350, 1420 480, 1450 555"
        fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#tealArrow)"/>

  <!-- Goal box -->
  <rect x="1340" y="560" width="230" height="80" rx="14" fill="#d4f3ec" stroke="#0f766e" stroke-width="2.5"/>
  <text x="1455" y="608" text-anchor="middle" font-size="17" font-weight="700" fill="#0f4c46">Goal: Movement</text>
</svg>
