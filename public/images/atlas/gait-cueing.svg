<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc" font-family="Arial, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="title">Atlas 4-3. 외부 단서(Cueing)가 보행을 다시 움직이게 한다</title>
<desc id="desc">바닥선, 리듬, 계단, 레이저 단서로 첫발이 다시 나가는 장면을 단순화한 그림</desc>
<rect width="960" height="460" rx="28" fill="#f8fafc"/>
<text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Atlas 4-3. 외부 단서(Cueing)가 보행을 다시 움직이게 한다</text>
<text x="480" y="66" text-anchor="middle" font-size="13" fill="#475569">위: 내부 시동이 끊겨 멈춘 상태 → 아래: 바깥에서 들어온 단서가 시동을 대신 건다</text>
