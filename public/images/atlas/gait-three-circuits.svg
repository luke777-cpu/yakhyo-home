<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" font-family="Arial, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="title">Atlas 4-4. 세 가지 걸음, 세 가지 회로</title>
<desc id="desc">평지에서 다리를 들어 걷는 자동 보행, 발을 끄는 감각 구동 보행, 모래밭·흙길에서의 목표 지향 보행이 각각 어느 회로에 기대는지를 비교한 교육용 도식</desc>
<rect width="960" height="560" rx="28" fill="#f8fafc"/>
<text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Atlas 4-4. 세 가지 걸음, 세 가지 회로</text>
<text x="480" y="66" text-anchor="middle" font-size="13" fill="#475569">같은 '걷기'라도 어느 회로에 기대느냐가 다르다 — 기저핵이 흔들릴 때 다른 두 길이 남는다</text>
<rect x="40" y="92" width="280" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40" y="92" width="280" height="36" rx="16" fill="#fee2e2"/><rect x="40" y="110" width="280" height="18" fill="#fee2e2"/><text x="180.0" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">평지 — 들어 걷기 (자동 보행)</text><g transform="translate(150,150)" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="0" cy="12" r="11" fill="#e2e8f0"/><path d="M0 23 L0 68"/><path d="M0 34 L-16 56 M0 34 L16 54"/><path d="M0 68 L-10 105 M0 68 L18 84 L14 104"/></g><rect x="60" y="256" width="240" height="4" fill="#94a3b8"/><text x="180" y="282" text-anchor="middle" font-size="11" fill="#7f1d1d">한 발 들기 = 체중 이동 + 한 다리 서기</text><text x="180" y="298" text-anchor="middle" font-size="11" fill="#7f1d1d">+ 정확한 타이밍의 굴곡</text><rect x="70" y="320" width="220" height="44" rx="10" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/><text x="180.0" y="339" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">SMA → 기저핵 → 시상 → PPN</text><text x="180.0" y="355" text-anchor="middle" font-size="11" fill="#713f12">습관·자동 선택 회로</text><path d="M180 364 L180 384" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><rect x="70" y="388" width="220" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="180.0" y="407" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">OFF: 문이 안 열림</text><text x="180.0" y="423" text-anchor="middle" font-size="11" fill="#991b1b">이상운동증: 문이 너무 많이 열림</text><text x="180" y="460" text-anchor="middle" font-size="11" fill="#991b1b">선택·균형을 가장 많이 요구하는</text><text x="180" y="476" text-anchor="middle" font-size="11" fill="#991b1b">스윙기가 제일 먼저 무너진다</text><rect x="130" y="496" width="100" height="24" rx="12" fill="#dc2626"/><text x="180" y="513" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">안 된다</text><rect x="340" y="92" width="280" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="340" y="92" width="280" height="36" rx="16" fill="#e0f2fe"/><rect x="340" y="110" width="280" height="18" fill="#e0f2fe"/><text x="480.0" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">평지 — 발 끌기 (감각 구동 보행)</text><g transform="translate(450,150)" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="0" cy="12" r="11" fill="#e2e8f0"/><path d="M0 23 L0 68"/><path d="M0 34 L-16 56 M0 34 L16 54"/><path d="M0 68 L-8 105 M0 68 L14 105"/></g><rect x="360" y="256" width="240" height="4" fill="#94a3b8"/><path d="M436 254 L470 254" stroke="#0284c7" stroke-width="4"/><text x="480" y="282" text-anchor="middle" font-size="11" fill="#0c4a6e">두 발이 늘 바닥에 닿음</text><text x="480" y="298" text-anchor="middle" font-size="11" fill="#0c4a6e">= 한 다리 서기·자세 예측 불필요</text><rect x="370" y="320" width="220" height="44" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="480.0" y="339" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">발바닥 압력·관절감각 → 척수</text><text x="480.0" y="355" text-anchor="middle" font-size="11" fill="#0c4a6e">CPG + 뇌간 망상척수로</text><path d="M480 364 L480 384" stroke="#0284c7" stroke-width="3" marker-end="url(#ab)"/><rect x="370" y="388" width="220" height="44" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="480.0" y="407" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">기저핵 선택 회로를 우회</text><text x="480.0" y="423" text-anchor="middle" font-size="11" fill="#0c4a6e">아래층 회로로 앞으로 민다</text><text x="480" y="460" text-anchor="middle" font-size="11" fill="#0c4a6e">된다 — 그러나 낙상·관절 부담</text><text x="480" y="476" text-anchor="middle" font-size="11" fill="#0c4a6e">보폭은 작고 자세는 굽는다</text><rect x="415" y="496" width="130" height="24" rx="12" fill="#0284c7"/><text x="480" y="513" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">된다 — 대가 있음</text><rect x="640" y="92" width="280" height="430" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="640" y="92" width="280" height="36" rx="16" fill="#dcfce7"/><rect x="640" y="110" width="280" height="18" fill="#dcfce7"/><text x="780.0" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">모래밭·흙길 — 목표 지향 보행</text><g transform="translate(750,150)" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="0" cy="12" r="11" fill="#e2e8f0"/><path d="M0 23 L0 68"/><path d="M0 34 L-16 56 M0 34 L16 54"/><path d="M0 68 L-12 105 M0 68 L20 80 L12 100"/></g><path d="M660 258 Q690 246 720 258 T780 258 T840 258 T900 258" fill="none" stroke="#ca8a04" stroke-width="5"/><text x="780" y="282" text-anchor="middle" font-size="11" fill="#14532d">한 걸음마다 발 놓을 곳을 본다</text><text x="780" y="298" text-anchor="middle" font-size="11" fill="#14532d">밟을 때마다 강한 감각이 올라온다</text><rect x="670" y="320" width="220" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="780.0" y="339" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">시각·두정엽 → 전운동피질 → 소뇌</text><text x="780.0" y="355" text-anchor="middle" font-size="11" fill="#14532d">목표 지향(goal-directed) 회로</text><path d="M780 364 L780 384" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><rect x="670" y="388" width="220" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="780.0" y="407" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">자동 회로 대신 의식적 걸음</text><text x="780.0" y="423" text-anchor="middle" font-size="11" fill="#14532d">+ 큰 보폭·큰 감각 되먹임</text><text x="780" y="460" text-anchor="middle" font-size="11" fill="#14532d">걸음이 오히려 좋아진다</text><text x="780" y="476" text-anchor="middle" font-size="11" fill="#14532d">계단·장애물에서 잘 걷는 것과 같은 원리</text><rect x="730" y="496" width="100" height="24" rx="12" fill="#16a34a"/><text x="780" y="513" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">좋아진다</text><defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
<marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0284c7"/></marker>
<marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
</defs>
<text x="480" y="546" text-anchor="middle" font-size="11" fill="#888">교육용 도식. 실제로는 세 회로가 겹쳐 작동하며, 비중이 상황에 따라 옮겨간다는 뜻이다.</text>
</svg>