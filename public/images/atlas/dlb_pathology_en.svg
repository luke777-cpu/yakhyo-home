<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 800" role="img" aria-labelledby="title desc" font-family="Arial, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <title id="title">alpha-synuclein distribution in Parkinson's disease vs. Dementia with Lewy Bodies, and the one-year rule distinguishing DLB from PDD</title>
  <desc id="desc">Educational diagram in two panels. Left: four brain-region boxes (cortex/limbic system, basal forebrain, substantia nigra/brainstem, autonomic and olfactory systems) each rated with a plus-sign scale showing how much alpha-synuclein pathology is present in Parkinson's disease versus Dementia with Lewy Bodies (DLB); Parkinson's disease accumulates pathology from the brainstem upward, while DLB involves the cortex and limbic system early and broadly. Right: a clinical timeline comparing DLB (cognitive impairment and hallucinations, followed within one year by parkinsonism) with PDD, Parkinson's disease dementia (parkinsonism for years, followed by dementia after more than one year), illustrating that the same underlying alpha-synuclein pathology is distinguished clinically by the timing of symptom onset.</desc>
  <rect width="1620" height="800" rx="28" fill="#f8fafc"/>

  <!-- ============ LEFT PANEL ============ -->
  <text x="404" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">α-synuclein Distribution — Parkinson's Disease vs. DLB</text>

  <!-- column headers -->
  <text x="132" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Parkinson's</text>
  <text x="132" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">disease</text>
  <text x="676" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">DLB</text>

  <!-- Row 1: Cortex / limbic system (gray) -->
  <rect x="204" y="90" width="404" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2.5"/>
  <text x="406" y="136" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Cortex · limbic system</text>
  <text x="132" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">±</text>
  <text x="678" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#b91c1c">+++</text>

  <!-- Row 2: Basal forebrain (green) -->
  <rect x="204" y="200" width="404" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="406" y="246" text-anchor="middle" font-size="16" font-weight="600" fill="#14532d">Basal forebrain (acetylcholine)</text>
  <text x="132" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">+</text>
  <text x="678" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#b91c1c">+++</text>

  <!-- Row 3: Substantia nigra / brainstem (tan/gold) -->
  <rect x="204" y="310" width="404" height="80" rx="10" fill="#fefbea" stroke="#ca8a04" stroke-width="2.5"/>
  <text x="406" y="356" text-anchor="middle" font-size="16" font-weight="600" fill="#713f12">Substantia nigra · brainstem</text>
  <text x="132" y="358" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">+++</text>
  <text x="678" y="358" text-anchor="middle" font-size="20" font-weight="700" fill="#b91c1c">++</text>

  <!-- Row 4: Autonomic & olfactory systems (red/pink) -->
  <rect x="204" y="420" width="404" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="406" y="466" text-anchor="middle" font-size="16" font-weight="600" fill="#7f1d1d">Autonomic &amp; olfactory systems</text>
  <text x="132" y="468" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">++</text>
  <text x="678" y="468" text-anchor="middle" font-size="20" font-weight="700" fill="#b91c1c">++</text>

  <!-- Caption box -->
  <rect x="246" y="524" width="322" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="406" y="546" text-anchor="middle" font-size="12.5" fill="#334155">Parkinson's: bottom-up</text>
  <text x="406" y="564" text-anchor="middle" font-size="12.5" fill="#334155">DLB: reaches cortex and limbic system early and broadly</text>

  <!-- divider between panels -->
  <line x1="812" y1="70" x2="812" y2="700" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ============ RIGHT PANEL ============ -->
  <text x="1216" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">DLB vs. PDD — The One-Year Rule</text>

  <!-- Time axis -->
  <line x1="858" y1="398" x2="1535" y2="398" stroke="#64748b" stroke-width="2.5" marker-end="url(#timeArrow)"/>
  <text x="1560" y="403" font-size="15" font-weight="600" fill="#475569">Time</text>
  <defs>
    <marker id="timeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>

  <!-- DLB track -->
  <text x="858" y="146" font-size="18" font-weight="700" fill="#7f1d1d">DLB</text>
  <line x1="890" y1="188" x2="985" y2="188" stroke="#991b1b" stroke-width="3.5"/>
  <line x1="985" y1="188" x2="1082" y2="188" stroke="#991b1b" stroke-width="3.5" stroke-dasharray="8 6"/>
  <circle cx="985" cy="188" r="14" fill="#991b1b"/>
  <circle cx="1082" cy="188" r="14" fill="#9a3412"/>
  <text x="985" y="222" text-anchor="middle" font-size="13" fill="#334155">Cognitive impairment ·</text>
  <text x="985" y="238" text-anchor="middle" font-size="13" fill="#334155">hallucinations</text>
  <text x="1082" y="222" text-anchor="middle" font-size="13" fill="#334155">Parkinsonism</text>
  <text x="1082" y="238" text-anchor="middle" font-size="13" fill="#334155">(within 1 year)</text>

  <rect x="858" y="256" width="342" height="40" rx="8" fill="#fce7ea" stroke="#f3b6bd" stroke-width="1.5"/>
  <text x="1029" y="281" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Cognition first, or both within 1 year → DLB</text>

  <!-- PDD track -->
  <text x="858" y="440" font-size="18" font-weight="700" fill="#1e3a8a">PDD</text>
  <line x1="890" y1="472" x2="953" y2="472" stroke="#1d4ed8" stroke-width="3.5"/>
  <line x1="953" y1="472" x2="1277" y2="472" stroke="#1d4ed8" stroke-width="3.5" stroke-dasharray="8 6"/>
  <circle cx="953" cy="472" r="14" fill="#1d4ed8"/>
  <circle cx="1277" cy="472" r="14" fill="#312e81"/>
  <text x="953" y="506" text-anchor="middle" font-size="13" fill="#334155">Parkinsonism</text>
  <text x="953" y="522" text-anchor="middle" font-size="13" fill="#334155">(years)</text>
  <text x="1277" y="506" text-anchor="middle" font-size="13" fill="#334155">Dementia</text>
  <text x="1277" y="522" text-anchor="middle" font-size="13" fill="#334155">(after 1+ years)</text>

  <rect x="858" y="540" width="490" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1103" y="565" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Dementia years after motor symptoms → PDD</text>

  <!-- bottom caption -->
  <rect x="1030" y="644" width="373" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1216" y="667" text-anchor="middle" font-size="12.5" fill="#334155">Same α-synuclein pathology — distinguished by clinical timing</text>
</svg>
