<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 800" role="img" aria-labelledby="title desc" font-family="Arial, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <title id="title">Corticobasal Syndrome (CBS) — combined cortical and basal ganglia damage, and the alien limb pathway</title>
  <desc id="desc">Two-panel educational diagram. Left panel shows cortical damage (apraxia, cortical sensory loss, alien limb, myoclonus) and basal ganglia damage (bradykinesia and rigidity, dystonia, marked asymmetry, reduced levodopa response) converging on combined limb symptoms, caused by 4-repeat tauopathy (CBD) degenerating cortex, white matter, and basal ganglia together. Right panel shows a vertical flow of motor intention generation, motor plan execution, sensory feedback, and sense of body ownership, with a break in integration at the sensory feedback stage in CBS leading to loss of the feeling of having made a movement.</desc>
  <rect width="1620" height="800" rx="28" fill="#f8fafc"/>
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrowIndigo" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>

  <!-- ============ LEFT PANEL ============ -->
  <text x="310" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">CBS — Cortex and Basal Ganglia Damaged Together</text>

  <!-- Cortical damage box (indigo) -->
  <rect x="25" y="55" width="355" height="248" rx="16" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="202" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">Cortical damage</text>
  <text x="60" y="122" font-size="14" fill="#333">• Apraxia</text>
  <text x="60" y="158" font-size="14" fill="#333">• Cortical sensory loss</text>
  <text x="60" y="194" font-size="14" fill="#333">• Alien limb</text>
  <text x="60" y="230" font-size="14" fill="#333">• Myoclonus</text>

  <!-- Basal ganglia damage box (red) -->
  <rect x="430" y="55" width="355" height="248" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="607" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">Basal ganglia damage</text>
  <text x="465" y="122" font-size="14" fill="#333">• Bradykinesia &amp; rigidity</text>
  <text x="465" y="158" font-size="14" fill="#333">• Dystonia</text>
  <text x="465" y="194" font-size="14" fill="#333">• ↑↑ Asymmetry</text>
  <text x="465" y="230" font-size="14" fill="#333">• ↓ Levodopa response</text>

  <!-- Arrows down-and-inward into combined box -->
  <path d="M 220 303 L 330 358" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>
  <path d="M 590 303 L 470 358" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <!-- Combined symptoms box -->
  <rect x="118" y="365" width="570" height="140" rx="14" fill="#f5f5f4" stroke="#78716c" stroke-width="2"/>
  <text x="403" y="415" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Cortical + basal ganglia symptoms together in one limb</text>
  <text x="403" y="452" text-anchor="middle" font-size="13.5" font-style="italic" fill="#44403c">&#8220;Both &#8216;being slow&#8217; and &#8216;not knowing how to use it&#8217; at once&#8221;</text>

  <!-- Small tag box -->
  <rect x="196" y="530" width="430" height="56" rx="10" fill="#fffbeb" stroke="#ca8a04" stroke-width="2"/>
  <text x="411" y="552" text-anchor="middle" font-size="13" fill="#713f12">4-repeat tauopathy (CBD) → cortex, white matter, and</text>
  <text x="411" y="572" text-anchor="middle" font-size="13" fill="#713f12">basal ganglia degenerate together</text>

  <!-- divider -->
  <line x1="920" y1="60" x2="920" y2="620" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ============ RIGHT PANEL ============ -->
  <text x="1270" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Alien Limb — Why Does the Hand Feel Like It Isn&#8217;t Mine?</text>

  <!-- Box 1: motor intention (indigo) -->
  <rect x="1010" y="98" width="440" height="86" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="1230" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Generating motor intention</text>
  <text x="1230" y="156" text-anchor="middle" font-size="13" fill="#3730a3">(frontal lobe, SMA)</text>

  <!-- Arrow 1->2 -->
  <path d="M 1230 184 L 1230 210" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- Box 2: motor plan execution (blue) -->
  <rect x="1010" y="210" width="440" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="1230" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Executing the motor plan</text>
  <text x="1230" y="268" text-anchor="middle" font-size="13" fill="#1d4ed8">(cortico-basal ganglia network)</text>

  <!-- Arrow 2->3 -->
  <path d="M 1230 296 L 1230 322" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- Box 3: sensory feedback (green) with red strike accent -->
  <rect x="1010" y="322" width="440" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1230" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Sensory feedback</text>
  <text x="1230" y="380" text-anchor="middle" font-size="13" fill="#15803d">(parietal integration)</text>
  <line x1="1030" y1="400" x2="1430" y2="400" stroke="#dc2626" stroke-width="3"/>
  <text x="1230" y="421" text-anchor="middle" font-size="12.5" font-weight="600" fill="#dc2626">integration breaks down in CBS</text>

  <!-- Arrow 3->4 -->
  <path d="M 1230 434 L 1230 460" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- Box 4: sense of body ownership (gray) -->
  <rect x="1010" y="460" width="440" height="86" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="1230" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Sense of body ownership</text>
  <text x="1230" y="518" text-anchor="middle" font-size="13" fill="#475569">(&#8220;a movement I made&#8221;)</text>

  <!-- Callout box -->
  <rect x="1050" y="575" width="360" height="70" rx="12" fill="#fef2f2" stroke="#e11d48" stroke-width="2.5"/>
  <text x="1230" y="601" text-anchor="middle" font-size="13" font-style="italic" fill="#9f1239">&#8220;The movement happens, but the feeling that</text>
  <text x="1230" y="622" text-anchor="middle" font-size="13" font-style="italic" fill="#9f1239">I made it disappears&#8221;</text>
</svg>
