<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc" font-family="Arial, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="title">2026년 9월 7일 — 하루 출력 변화 대표 기록</title>
<desc id="desc">개인 약효일지에 기록된 체감 출력을 시각화한 그림. 06:00 서방형과 07:20 즉방형 뒤 08:36경 아침 ON 형성, 11:54 서방형 복용 뒤 점심 무렵 낮은 출력을 의도적으로 유지, 오후 4~6시 사이 가장 변동이 큰 하강, 17:40 복용 뒤 약 35분 만인 18:15경 저녁 ON 형성. 혈중 레보도파 농도나 연속 임상 측정값이 아니라 개인 기록을 바탕으로 정리한 대표 패턴이다.</desc>
<rect width="960" height="600" rx="28" fill="#f8fafc"/>
<text x="480" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">9월 7일 하루 출력 변화 — 대표 기록</text>
<text x="480" y="68" text-anchor="middle" font-size="13" fill="#475569">아침에는 ON을 만들고, 점심엔 낮은 출력을 지키고, 저녁엔 기다렸다가 다시 ON을 만든 하루</text>

