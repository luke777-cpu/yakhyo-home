<g transform="translate(80,522)">
  <line x1="0" y1="8" x2="36" y2="8" stroke="#1f6b62" stroke-width="3"/><circle cx="18" cy="8" r="3" fill="#1f6b62"/><text x="44" y="12" font-size="12" fill="#333">체감 출력 (0~100, 기록)</text>
