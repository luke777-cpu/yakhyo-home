<line x1="80" y1="120" x2="900" y2="120" stroke="#e2e8f0" stroke-width="1"/><text x="72" y="124" text-anchor="end" font-size="11" fill="#64748b">100</text>

<text x="80" y="460" text-anchor="middle" font-size="11" fill="#64748b">06:00</text>
