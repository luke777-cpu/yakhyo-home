<text x="480" y="576" text-anchor="middle" font-size="11" fill="#888">개인 약효일지에 기록된 체감 출력을 정리한 그림입니다(n=1). 혈중 레보도파 농도나 연속적인 임상 측정값이 아니며, 특정 처방을 권하는 자료가 아닙니다.</text>
